name: Selenium Tests

on:
  push:
    branches:
      - main
      - pradnyasBranch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'

      - name: Build and run tests
        run: mvn clean test
