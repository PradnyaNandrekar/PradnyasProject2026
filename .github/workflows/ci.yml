name: Selenium Tests

on:
  push:
    branches:
      - pradnyasBranch   # ✅ your branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # ✅ MUST ADD
          java-version: '11'

      - name: Run Tests
        run: mvn clean test
